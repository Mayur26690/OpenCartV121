version: '3.8'

services:
  selenium-hub:
    image: selenium/hub:4.19.1-20240417
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
	networks:
		- grid

  node-chrome:
    image: selenium/node-chrome:4.19.1-20240417
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_SESSION_TIMEOUT=300
	  networks:
	  		- grid
  

  firefox:
    image: selenium/node-firefox:4.19.1-20240417
    environment:
      - SE_EVENT_BUS_HOST=hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_SESSION_TIMEOUT=300
	  networks:
	  		- grid